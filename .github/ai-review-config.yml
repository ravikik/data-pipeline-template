# AI Code Review Configuration

# Review Settings
review:
  # AI model to use for code review
  model: "gpt-4"
  
  # Level of detail in reviews: basic, detailed, comprehensive
  level: "detailed"
  
  # Maximum number of comments per PR
  max_comments: 25
  
  # Focus areas for the AI review
  focus_areas:
    - code_quality
    - best_practices
    - security
    - performance
    - maintainability
    - documentation

# File Patterns
files:
  # Files to include in review
  include:
    - "**/*.py"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.tf"
    - "**/Dockerfile*"
    - "**/*.sh"
  
  # Files to exclude from review
  exclude:
    - "**/*.json"
    - "**/*.md"
    - "**/*.txt"
    - "**/*.csv"
    - "**/LICENSE"
    - "**/__pycache__/**"
    - "**/venv/**"
    - "**/.git/**"

# Quality Thresholds
thresholds:
  # Cyclomatic complexity threshold
  max_complexity: 10
  
  # Maintainability index minimum
  min_maintainability: 65
  
  # Maximum function length (lines)
  max_function_length: 50
  
  # Maximum file length (lines)
  max_file_length: 500

# Quality Gate Enforcement
quality_gate:
  # Enable quality gate (blocks merge if score below threshold)
  enabled: true
  
  # Minimum quality score required (0-100)
  minimum_score: 90
  
  # Scoring penalties per issue severity
  scoring:
    critical_penalty: 20  # Points deducted per critical issue
    error_penalty: 10     # Points deducted per error
    warning_penalty: 5    # Points deducted per warning
    info_penalty: 1       # Points deducted per info/suggestion
  
  # Grade thresholds
  grades:
    a_plus: 95   # Score >= 95: A+ (Excellent)
    a: 90        # Score >= 90: A (Good)
    b: 80        # Score >= 80: B (Fair)
    c: 70        # Score >= 70: C (Poor)
    d: 60        # Score >= 60: D (Very Poor)
    # Score < 60: F (Failing)
  
  # Enforcement options
  enforcement:
    # Block PR merge if score below minimum
    block_merge: true
    
    # Post detailed score breakdown as PR comment
    post_comment: true
    
    # Include improvement suggestions
    suggest_improvements: true

# Security Checks
security:
  # Check for hardcoded secrets
  check_secrets: true
  
  # Check for vulnerable dependencies
  check_dependencies: true
  
  # Check for common security patterns
  check_patterns: true
  
  # Patterns to flag as potential security issues
  sensitive_patterns:
    - "password\\s*=\\s*['\"]"
    - "api_key\\s*=\\s*['\"]"
    - "secret\\s*=\\s*['\"]"
    - "token\\s*=\\s*['\"]"
    - "private_key\\s*=\\s*['\"]"

# Code Style
style:
  # Check for TODO/FIXME comments
  flag_todos: true
  
  # Check for debug statements
  flag_debug_statements: true
  
  # Debug statement patterns
  debug_patterns:
    - "print\\("
    - "console\\.log\\("
    - "debugger"
    - "pdb\\.set_trace"
    - "breakpoint\\("

# AI Review Prompts
prompts:
  system: |
    You are an expert code reviewer specializing in data engineering and Python development.
    Focus on: code quality, best practices, security, performance, and maintainability.
    Provide constructive, actionable feedback.
  
  review: |
    Review the following code changes:
    - Identify potential bugs or errors
    - Suggest improvements for code quality
    - Check for security vulnerabilities
    - Recommend performance optimizations
    - Verify adherence to Python best practices
    - Ensure proper error handling
    - Check for adequate documentation
