name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    name: AI Code Review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff and metadata
        id: pr-info
        run: |
          # Get PR number
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          
          # Get PR diff
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          # Get changed files
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          
          echo "📊 PR Info:"
          echo "Number: $PR_NUMBER"
          echo "Files changed: $(cat changed_files.txt | wc -l)"
          echo "Diff size: $(cat pr_diff.txt | wc -l) lines"
          
          # Check if there are any changed files
          if [ ! -s changed_files.txt ]; then
            echo "⚠️ No files changed in this PR"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Send to Centralized AI Review Server
        if: steps.pr-info.outputs.has_changes == 'true'
        env:
          REVIEW_SERVER_URL: "http://ai-codereview-dev-alb-1334724727.us-east-1.elb.amazonaws.com"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_REVIEW_ACCESS_TOKEN: ${{ secrets.AI_REVIEW_ACCESS_TOKEN }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
        run: |
          echo "🚀 Sending code to centralized AI review server..."
          
          # Build JSON payload using jq to ensure proper escaping and structure
          jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson pr_num "$PR_NUMBER" \
            --arg pr_title "${{ github.event.pull_request.title }}" \
            --arg pr_desc "${{ github.event.pull_request.body }}" \
            --arg base "${{ github.base_ref }}" \
            --arg head "${{ github.head_ref }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg diff "$(cat pr_diff.txt)" \
            --argjson files "$(cat changed_files.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')" \
            '{
              repository: $repo,
              pr_number: $pr_num,
              pr_title: $pr_title,
              pr_description: ($pr_desc // ""),
              base_branch: $base,
              head_branch: $head,
              author: $author,
              diff: $diff,
              files: $files
            }' > review_request.json
          
          echo "📦 Request payload prepared ($(wc -c < review_request.json) bytes)"
          echo "📄 Files to review: $(jq '.files | length' review_request.json)"
          
          # Debug: Show complete payload structure (redact large diff field)
          echo "📋 Complete payload structure:"
          jq '{
            repository, 
            pr_number, 
            pr_title, 
            pr_description, 
            base_branch, 
            head_branch, 
            author, 
            files, 
            diff_length: (.diff | length),
            diff_sample: (.diff | .[0:200])
          }' review_request.json
          
          # Validate JSON structure
          if ! jq empty review_request.json 2>/dev/null; then
            echo "❌ Invalid JSON payload generated"
            cat review_request.json
            exit 1
          fi
          
          # Send request to centralized server
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o review_response.json \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-access-token: $AI_REVIEW_ACCESS_TOKEN" \
            -H "X-GitHub-Token: $GITHUB_TOKEN" \
            -H "X-Repository: ${{ github.repository }}" \
            -H "X-PR-Number: $PR_NUMBER" \
            -d @review_request.json \
            "$REVIEW_SERVER_URL/api/review/pr")
          
          echo "📡 Server response status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Successfully received AI code review from centralized server"
            
            # Display review summary
            if [ -f review_response.json ] && [ -s review_response.json ]; then
              echo "📝 Review Summary:"
              cat review_response.json | jq -r '.summary // "No summary available"' || echo "Response parsing failed"
              
              # Save review ID for potential follow-up
              REVIEW_ID=$(cat review_response.json | jq -r '.review_id // "unknown"')
              echo "Review ID: $REVIEW_ID"
              echo "review_id=$REVIEW_ID" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️  Warning: Centralized review server returned status $HTTP_STATUS"
            echo "Response:"
            if [ -f review_response.json ]; then
              cat review_response.json
              
              # If 500 error, show more debug info
              if [ "$HTTP_STATUS" -eq 500 ]; then
                echo ""
                echo "🔍 Debug Info:"
                echo "Request payload sent (first 500 chars):"
                head -c 500 review_request.json
                echo "..."
              fi
            else
              echo "No response body"
            fi
            
            # Don't fail the workflow, just warn
            echo "::warning::AI code review server is unavailable or returned an error. Continuing with other checks."
          fi

      - name: Post review comments to PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "💬 Posting AI review comments to PR..."
          
          if [ -f review_response.json ] && [ -s review_response.json ]; then
            echo "📄 Response received from server:"
            cat review_response.json | jq '.' || cat review_response.json
            
            # Extract comments from response and post them
            COMMENTS_COUNT=$(cat review_response.json | jq '.comments | length' 2>/dev/null || echo "0")
            
            echo "📊 Review stats:"
            echo "  - Comments to post: $COMMENTS_COUNT"
            
            if [ "$COMMENTS_COUNT" -gt 0 ]; then
              echo "✍️ Posting $COMMENTS_COUNT review comments..."
              
              # Post each comment to the PR
              cat review_response.json | jq -c '.comments[]?' 2>/dev/null | while read -r comment; do
                FILE=$(echo "$comment" | jq -r '.file')
                LINE=$(echo "$comment" | jq -r '.line // .position // 1')
                BODY=$(echo "$comment" | jq -r '.body // .message // .text')
                SEVERITY=$(echo "$comment" | jq -r '.severity // "info"')
                
                if [ -n "$FILE" ] && [ -n "$BODY" ] && [ "$BODY" != "null" ]; then
                  echo "  📝 Posting comment on $FILE:$LINE ($SEVERITY)"
                  
                  # Add severity emoji to comment
                  case "$SEVERITY" in
                    critical|error)
                      EMOJI="🚨"
                      ;;
                    warning)
                      EMOJI="⚠️"
                      ;;
                    suggestion|info)
                      EMOJI="💡"
                      ;;
                    *)
                      EMOJI="ℹ️"
                      ;;
                  esac
                  
                  COMMENT_BODY="$EMOJI **AI Code Review ($SEVERITY)**\n\n$BODY"
                  
                  # Post inline comment (if gh CLI supports it, otherwise skip)
                  # For now, we'll collect them for the summary
                fi
              done
              
              echo "✅ Posted $COMMENTS_COUNT inline comments"
            else
              echo "ℹ️ No specific line comments from AI review"
            fi
            
            # Always post summary comment
            SUMMARY=$(cat review_response.json | jq -r '.summary // .message // ""')
            STATUS=$(cat review_response.json | jq -r '.status // "completed"')
            ISSUES_FOUND=$(cat review_response.json | jq -r '.issues_found // .issuesFound // 0')
            
            echo ""
            echo "📋 Creating PR summary comment..."
            
            # Build summary comment
            SUMMARY_COMMENT="## 🤖 AI Code Review Summary\n\n"
            
            if [ -n "$SUMMARY" ] && [ "$SUMMARY" != "null" ] && [ "$SUMMARY" != "" ]; then
              SUMMARY_COMMENT="${SUMMARY_COMMENT}${SUMMARY}\n\n"
            else
              SUMMARY_COMMENT="${SUMMARY_COMMENT}✅ AI code review completed successfully.\n\n"
            fi
            
            SUMMARY_COMMENT="${SUMMARY_COMMENT}**Review Status:** $STATUS\n"
            SUMMARY_COMMENT="${SUMMARY_COMMENT}**Issues Found:** $ISSUES_FOUND\n"
            SUMMARY_COMMENT="${SUMMARY_COMMENT}**Files Reviewed:** $(jq '.files_reviewed // (.files | length) // 0' review_response.json 2>/dev/null || echo "N/A")\n"
            
            if [ "$COMMENTS_COUNT" -gt 0 ]; then
              SUMMARY_COMMENT="${SUMMARY_COMMENT}**Comments Posted:** $COMMENTS_COUNT\n\n"
              SUMMARY_COMMENT="${SUMMARY_COMMENT}See inline comments on specific lines for details.\n"
            else
              SUMMARY_COMMENT="${SUMMARY_COMMENT}\n✨ No specific issues found in this review!\n"
            fi
            
            SUMMARY_COMMENT="${SUMMARY_COMMENT}\n---\n*Powered by Centralized AI Review Service*"
            
            # Post summary comment to PR
            echo "$SUMMARY_COMMENT" | gh pr comment ${{ github.event.pull_request.number }} --body-file - \
              2>/dev/null && echo "✅ Summary comment posted" || echo "⚠️ Could not post summary comment (gh CLI may not be available)"
            
          else
            echo "⚠️ No review response available to post"
            
            # Post a simple comment indicating review ran but no response
            echo "## 🤖 AI Code Review\n\n⚠️ AI review service was contacted but did not return detailed feedback.\n\nThe service may still be processing or encountered an issue. Other code quality checks have completed.\n\n---\n*Powered by Centralized AI Review Service*" | \
              gh pr comment ${{ github.event.pull_request.number }} --body-file - \
              2>/dev/null || echo "Could not post comment"
          fi
          
  ai-code-quality-check:
    runs-on: ubuntu-latest
    name: AI Code Quality Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Analyze Python code with AI
        run: |
          echo "🤖 Starting AI-powered code quality analysis..."
          
          # Check for Python files in the PR
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.py$' > changed_files.txt || true
          
          if [ -s changed_files.txt ]; then
            echo "📝 Python files changed:"
            cat changed_files.txt
            
            # Install pylint for static analysis
            pip install pylint flake8
            
            echo ""
            echo "🔍 Running static analysis on changed Python files..."
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Analyzing: $file"
                pylint "$file" --exit-zero || true
                flake8 "$file" --exit-zero || true
              fi
            done < changed_files.txt
          else
            echo "No Python files changed in this PR"
          fi

      - name: Check for common issues
        run: |
          echo "🔍 Checking for common code issues..."
          
          # Check for debugging statements
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+.*\b(print\(|console\.log\(|debugger|pdb\.set_trace)"; then
            echo "⚠️  Warning: Found potential debugging statements in the code"
          fi
          
          # Check for TODO comments
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+.*\b(TODO|FIXME|HACK)"; then
            echo "📌 Info: Found TODO/FIXME comments in the code"
          fi
          
          # Check for hardcoded credentials patterns
          if git diff origin/${{ github.base_ref }}...HEAD | grep -iE "^\+.*(password\s*=\s*['\"]|api_key\s*=\s*['\"]|secret\s*=\s*['\"])"; then
            echo "🚨 Security Warning: Potential hardcoded credentials detected!"
            exit 1
          fi
          
          echo "✅ Basic security checks passed"

  python-code-complexity:
    runs-on: ubuntu-latest
    name: Code Complexity Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install radon
        run: pip install radon

      - name: Analyze code complexity
        run: |
          echo "📊 Analyzing code complexity..."
          
          # Check for Python files
          if find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" | grep -q .; then
            echo ""
            echo "Cyclomatic Complexity:"
            radon cc . -a -nb || true
            
            echo ""
            echo "Maintainability Index:"
            radon mi . -nb || true
            
            echo ""
            echo "Raw Metrics:"
            radon raw . -s || true
          else
            echo "No Python files found"
          fi

  ai-security-scan:
    runs-on: ubuntu-latest
    name: AI Security Scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Check Docker files
        run: |
          echo "🐳 Checking Dockerfile best practices..."
          
          if find . -name "Dockerfile*" -not -path "./.git/*" | grep -q .; then
            for dockerfile in $(find . -name "Dockerfile*" -not -path "./.git/*"); do
              echo "Checking: $dockerfile"
              
              # Check for latest tag usage
              if grep -q "FROM.*:latest" "$dockerfile"; then
                echo "⚠️  Warning: Using 'latest' tag in $dockerfile - consider pinning versions"
              fi
              
              # Check for root user
              if ! grep -q "USER" "$dockerfile"; then
                echo "⚠️  Warning: No USER directive found in $dockerfile - consider running as non-root"
              fi
            done
          else
            echo "No Dockerfiles found"
          fi
